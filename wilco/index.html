<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#FFFFFF; --ink:#101714; --text:#2B3531; --muted:#66736D; --faint:#9AA59F;
    --line:#E4E9E6; --line-2:#CFD8D3;
    --green:#0C6149; --green-l:#2E8A6C; --mint:#F0F6F3; --mint-2:#DCE9E2;
    --c-desarrollo:#9CC7B2; --c-produccion:#0C6149; --c-cliente:#D9A441; --c-entrega:#101714;
    --sans:"Manrope","Helvetica Neue",Arial,sans-serif;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{background:var(--bg)}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 clamp(16px,5vw,64px); position:relative; overflow-x:hidden}
  /* fondo con vida: franja de marca, halo verde y retícula de puntos */
  body::before{content:""; position:fixed; inset:0 0 auto 0; height:5px; background:var(--green); z-index:10}
  .bgfx{position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 520px at 88% -8%, rgba(12,97,73,.10), transparent 70%),
      radial-gradient(700px 480px at -10% 105%, rgba(12,97,73,.07), transparent 70%);}
  .bgfx::after{content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(12,97,73,.16) 1px, transparent 1.2px); background-size:22px 22px;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 55%); mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 55%);}
  .wrap{max-width:1140px; margin:0 auto; position:relative; z-index:1}
  a{color:inherit}
  a:focus-visible, button:focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:6px}
  .mono{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase}
  .num{font-variant-numeric:tabular-nums lining-nums}

  .top{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; padding-block:26px 20px; border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); background:rgba(255,255,255,.9); box-shadow:0 0 0 100vmax rgba(255,255,255,.9); clip-path:inset(0 -100vmax); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:5}
  .mark{display:flex; align-items:center; gap:14px; text-decoration:none}
  .mark img{height:32px; width:auto; display:block}
  .mark span{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border-left:1px solid var(--line-2); padding-left:14px}
  nav{display:flex; gap:4px; flex-wrap:wrap}
  nav a{font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; padding:8px 15px; border-radius:999px; transition:background .15s,color .15s}
  nav a:hover{color:var(--green); background:var(--mint)}
  nav a.on{color:#fff; background:var(--green)}

  main section.page{display:none; padding-block:64px 96px}
  main section.page.on{display:block}
  @media (prefers-reduced-motion:no-preference){ main section.page.on{animation:in .35s ease both} @keyframes in{from{transform:translateY(6px)} to{transform:none}} }

  /* ---------- inicio ---------- */
  .hero{position:relative}
  .hero .wm{position:absolute; right:-2%; top:-18px; width:min(46%,520px); opacity:.06; pointer-events:none; user-select:none}
  .strip{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:30px; position:relative}
  .pill{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--green); background:var(--mint); padding:6px 13px 6px 11px; border-radius:999px}
  .pill::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--green)}
  .strip .mono{color:var(--muted)}
  h1.display{font-weight:800; font-size:clamp(60px,10vw,132px); line-height:.9; letter-spacing:-.045em; color:var(--green); position:relative}
  h1.display em{font-style:normal; color:var(--ink)}
  .tagline{font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(24px,3vw,36px); line-height:1.25; color:var(--green); max-width:30ch; margin-top:26px; text-wrap:balance; position:relative}
  .about{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(24px,4vw,48px); margin-top:64px; padding-top:28px; border-top:1px solid var(--line-2)}
  .about .k{color:var(--green); margin-bottom:12px; display:flex; align-items:center; gap:10px}
  .about .k b{font-weight:500; color:var(--faint)}
  .about p{font-size:15.5px; color:var(--text); max-width:40ch}
  .about p strong{color:var(--ink); font-weight:700}

  .bars{display:flex; gap:6px; margin-block:72px 28px}
  .bars i{height:3px; background:var(--green); border-radius:2px}
  .bars i:nth-child(1){width:44px} .bars i:nth-child(2){width:14px; opacity:.55} .bars i:nth-child(3){width:6px; opacity:.3}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .card{position:relative; display:block; text-decoration:none; border:1px solid var(--line); border-radius:16px; padding:24px 26px; background:rgba(255,255,255,.85); transition:border-color .2s, background .2s, transform .2s}
  .card:hover{border-color:var(--green); background:var(--mint)}
  @media (prefers-reduced-motion:no-preference){ .card:hover{transform:translateY(-2px)} }
  .card .k{color:var(--muted)}
  .card b{display:block; font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.01em; margin-top:8px}
  .card small{display:block; color:var(--muted); font-size:14px; margin-top:2px}
  .card .go{position:absolute; right:24px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-2); color:var(--green); font-weight:700; transition:background .2s,color .2s,border-color .2s}
  .card:hover .go{background:var(--green); border-color:var(--green); color:#fff}
  .card.lite{background:#E6F2EB; border-color:#CBE2D5}
  .card.lite:hover{background:#D8EBE0; border-color:var(--green-l)}
  .card.lite .k{color:var(--green-l)}
  .card.lite .go{background:#fff; border-color:#CBE2D5}
  .card.big{grid-column:1/-1; background:var(--green); border-color:var(--green); padding:clamp(28px,4vw,44px); overflow:hidden}
  .card.big:hover{background:#0A5741}
  .card.big .k{color:#BFDACD}
  .card.big b{font-size:clamp(40px,6vw,76px); font-weight:800; letter-spacing:-.04em; line-height:1; color:#fff; margin-top:12px}
  .card.big small{font-family:var(--serif); font-style:italic; font-size:clamp(18px,2vw,22px); color:#D6E8DF; margin-top:12px}
  .card.big .go{width:56px; height:56px; font-size:20px; border-color:rgba(255,255,255,.35); color:#fff; right:clamp(24px,4vw,44px)}
  .card.big:hover .go{background:#fff; color:var(--green)}
  .card.big .wm{position:absolute; right:12%; bottom:-30%; width:360px; opacity:.09; filter:brightness(0) invert(1); pointer-events:none}

  /* ---------- cabeceras de sección ---------- */
  .shead{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:40px; padding-bottom:22px; border-bottom:2px solid var(--green)}
  .shead h2{font-weight:800; font-size:clamp(42px,6vw,76px); line-height:1; letter-spacing:-.04em; color:var(--green)}
  .shead h2 span{color:var(--ink)}
  .shead .meta{color:var(--muted); text-align:right; display:grid; gap:6px}

  .dl{display:inline-flex; align-items:center; gap:9px; font:700 14px var(--sans); color:var(--green); background:#fff; border:1.5px solid var(--green); padding:9px 16px 9px 14px; border-radius:999px; text-decoration:none; transition:background .15s,color .15s}
  .dl:hover{background:var(--green); color:#fff}
  .dl svg{width:16px; height:16px}
  .shead .side{display:grid; gap:12px; justify-items:end}
  /* ---------- presupuesto ---------- */
  .kv{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:40px}
  .kv > div{background:var(--mint); border-radius:10px; padding:12px 18px; min-width:180px}
  .kv .k{color:var(--green); margin-bottom:2px; font-size:10.5px}
  .kv .v{font-size:16px; font-weight:700; color:var(--ink)}
  .tblw{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:560px}
  th{font-family:var(--mono); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); text-align:left; padding:0 16px 12px 0; border-bottom:1px solid var(--line-2)}
  td{padding:18px 16px 18px 0; border-bottom:1px solid var(--line); vertical-align:top; font-size:15.5px}
  td.c{font-weight:700; color:var(--ink); width:36%}
  td.d{color:var(--muted)}
  .r{text-align:right; padding-right:0}
  td.r, th.r{white-space:nowrap}
  tr.sub td{border-bottom:none; padding-block:16px; font-weight:800; color:var(--ink); font-size:17px}
  tr.sub td.lbl{font-family:var(--mono); font-weight:500; font-size:11px; letter-spacing:.12em; color:var(--muted); text-align:right}
  tr.sep td{padding:0; border-bottom:none; height:22px; background-image:repeating-linear-gradient(90deg, var(--green) 0 18px, transparent 18px 26px); background-size:100% 2px; background-repeat:no-repeat; background-position:0 50%}
  .total{display:flex; justify-content:space-between; align-items:center; gap:24px; margin-top:10px; padding:22px 28px; background:var(--green); color:#fff; border-radius:14px}
  .total .k{color:#CFE3DA}
  .total .v{font-size:clamp(36px,4.6vw,56px); font-weight:800; line-height:1; letter-spacing:-.03em}
  .total .v span{font-size:.5em; margin-left:6px; color:#CFE3DA}
  .ivanote{text-align:right; color:var(--muted); font-size:13.5px; margin-top:10px}
  .notas{margin-top:48px; display:grid; gap:10px; max-width:74ch}
  .notas h3{color:var(--green); margin-bottom:4px}
  .notas p{color:var(--text); padding-left:20px; position:relative; font-size:15px}
  .notas p::before{content:""; position:absolute; left:2px; top:.62em; width:7px; height:7px; border-radius:2px; background:var(--green)}

  /* ---------- timing ---------- */
  .toggle{display:inline-flex; background:var(--mint); border-radius:999px; padding:4px; gap:2px}
  .toggle button{font:600 13.5px var(--sans); color:var(--muted); background:none; border:0; padding:8px 16px; border-radius:999px; cursor:pointer}
  .toggle button[aria-pressed="true"]{background:#fff; color:var(--green); box-shadow:0 1px 3px rgba(16,23,20,.12)}
  .tbar{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px}
  .legend{display:flex; gap:20px; flex-wrap:wrap; color:var(--muted); font-size:14px}
  .legend span{display:inline-flex; align-items:center; gap:8px}
  .legend i{width:18px; height:9px; border-radius:999px}
  .gw{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:#fff}
  .gantt{min-width:720px}
  .g-row{display:grid; grid-template-columns:260px 1fr; border-top:1px solid var(--line); min-height:58px}
  .g-row:first-child{border-top:none}
  .g-l{padding:14px 18px; font-size:15px; font-weight:600; color:var(--ink); border-right:1px solid var(--line); display:flex; align-items:center; gap:10px}
  .g-l i{width:9px; height:9px; border-radius:50%; flex:none}
  .g-l small{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); font-weight:400; text-transform:uppercase}
  .g-t{position:relative}
  .g-cols{position:absolute; inset:0; display:grid}
  .g-cols div{border-left:1px solid var(--line)}
  .g-cols div:first-child{border-left:none}
  .g-head{background:var(--mint)}
  .g-head .g-l{color:var(--green)}
  .g-head .g-cols div{padding:18px 12px 0; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--green); text-transform:uppercase}
  .g-bar{position:absolute; top:50%; height:16px; margin-top:-8px; border-radius:999px}
  .g-dot{position:absolute; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px currentColor}
  .cal{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff}
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); background:var(--mint)}
  .cal-dow div{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--green); padding:12px 14px}
  .cal-wk{position:relative; border-top:1px solid var(--line)}
  .cal-days{display:grid; grid-template-columns:repeat(7,1fr)}
  .cal-days div.off{background:repeating-linear-gradient(135deg, #F5F7F6 0 6px, #EEF2F0 6px 12px); color:var(--faint)}
  .cal-dow div.we{color:var(--faint)}
  .cal-days div{min-height:112px; padding:10px 14px; border-left:1px solid var(--line); font-family:var(--mono); font-size:12px; color:var(--muted)}
  .cal-days div:first-child{border-left:none}
  .cal-days div.m b{color:var(--green); font-weight:500; margin-left:6px}
  .cal-evs{position:absolute; left:0; right:0; top:38px; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:28px; gap:6px 0; padding:0 6px}
  .cal-ev{margin:0 4px; border-radius:8px; padding:0 12px; font-size:13px; font-weight:700; line-height:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff}
  .cal-ev.desarrollo{background:var(--c-desarrollo); color:var(--ink)}
  .cal-ev.cliente{background:var(--c-cliente); color:var(--ink)}
  .cal-ev.produccion{background:var(--c-produccion)}
  .cal-ev.entrega{background:var(--c-entrega)}
  .calw{overflow-x:auto}
  .calw .cal{min-width:760px}

  /* ---------- tratamiento ---------- */
  .t-intro{font-family:var(--serif); font-style:italic; font-size:clamp(22px,2.6vw,30px); line-height:1.3; color:var(--green); max-width:34ch; margin-bottom:64px; text-wrap:balance}
  .trat{display:grid; gap:72px}
  .tb{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:clamp(24px,4vw,56px); align-items:center}
  .tb:nth-child(even){grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .tb:nth-child(even) img{order:2}
  .tb img{width:100%; max-width:100%; aspect-ratio:16/10; object-fit:cover; display:block; border-radius:14px}
  .tb .n{color:var(--green); margin-bottom:10px}
  .tb h3{font-weight:800; font-size:clamp(28px,3.2vw,40px); line-height:1.05; letter-spacing:-.03em; color:var(--ink); margin-bottom:14px}
  .tb p{color:var(--text); max-width:42ch}
  .tb.noimg{grid-template-columns:1fr; text-align:center; justify-items:center; padding-block:40px; border-top:1px solid var(--line)}
  .tb.noimg h3{font-family:var(--serif); font-style:italic; font-weight:500; font-size:clamp(34px,4.4vw,56px); color:var(--green); letter-spacing:-.01em}

  footer{border-top:1px solid var(--line); padding-block:22px 34px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; color:var(--muted); position:relative; z-index:1}
  footer .sel{user-select:all; color:var(--green)}

  @media (max-width:820px){ .about{grid-template-columns:1fr; gap:28px} .tb, .tb:nth-child(even){grid-template-columns:1fr} .tb:nth-child(even) img{order:0} }
  @media (max-width:760px){ .top{position:static} .shead .meta{text-align:left} .shead .side{justify-items:start} .mark span{display:none} .cards{grid-template-columns:1fr} .g-row{grid-template-columns:190px 1fr} .hero .wm{width:70%; top:40px} }
  @media (max-width:440px){ nav a{padding:7px 11px; font-size:13px} .card .go{display:none} .card.big .wm{display:none} }
</style>

</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a class="mark" href="#inicio"><img id="wm" alt="Wilco"><span id="mark-sub"></span></a>
    <nav id="nav" aria-label="Secciones"></nav>
  </header>
  <main id="main"></main>
  <footer>
    <span class="mono" id="f-ref"></span>
    <span class="mono"><span id="f-autor"></span> · <span class="sel" id="f-mail"></span></span>
  </footer>
</div>

<script>
(() => {
  const P = JSON.parse(document.getElementById("proyecto").textContent);
  const L = {inicio:"Inicio", tratamiento:"Tratamiento", presupuesto:"Presupuesto", timing:"Timing"};
  const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const DOW = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const TIPOS = {desarrollo:"Desarrollo", produccion:"Producción", cliente:"Revisión", entrega:"Entrega"};
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const fd = s => { const d = typeof s === "string" ? pd(s) : s; return `${d.getDate()} ${MES[d.getMonth()]}`; };
  const fdy = s => `${fd(s)} ${pd(s).getFullYear()}`;
  const money = n => { const sg = n < 0 ? "−" : ""; return sg + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " €"; };
  const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const B = P.presupuesto, T = P.timing, TR = P.tratamiento;
  const trabajo = B.partidas.reduce((s,p) => s + p.total, 0);
  const TOTAL = trabajo + (B.extras || []).reduce((s,p) => s + p.total, 0);

  document.getElementById("wm").src = P.wordmark;
  document.getElementById("mark-sub").textContent = `${P.proyecto} · ${P.autor.nombre}`;
  const pages = ["inicio", "tratamiento", "presupuesto", "timing"].filter(p => p !== "tratamiento" || TR);
  document.getElementById("nav").innerHTML = pages.map(p => `<a href="#${p}" data-p="${p}">${L[p]}</a>`).join("");
  document.getElementById("f-ref").textContent = `${P.ref} · ${P.version}`;
  document.getElementById("f-autor").textContent = P.autor.nombre;
  document.getElementById("f-mail").textContent = P.autor.email;

  const allD = T.fases.flatMap(f => [f.ini, f.fin]).sort();
  const D0 = allD[0], D1 = allD[allD.length-1];
  const ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>`;
  const secHead = (k, meta, pdf) => `<div class="shead"><h2>${L[k]}<span>.</span></h2><div class="side">${pdf ? `<a class="dl" href="${esc(pdf)}" target="_blank" rel="noopener">${ICON}Descargar PDF</a>` : ""}<div class="meta mono">${meta || ""}</div></div></div>`;
  const S = {};

  S.inicio = () => `
    <div class="hero">
      <img class="wm" src="${P.wordmark}" alt="" aria-hidden="true">
      <div class="strip"><span class="pill">${esc(P.estado)}</span><span class="mono">${esc(P.ref)} · ${esc(P.version)} · ${fdy(P.fecha)}</span></div>
      <h1 class="display">${esc(P.proyecto)}<em>.</em></h1>
      <p class="tagline">${esc(P.tagline)}</p>
    </div>
    <div class="about">${P.bloques.map((b,i) => `<div><div class="k mono">${esc(b.titulo)}</div><p>${b.texto}</p></div>`).join("")}</div>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cards">
      ${TR ? `<a class="card big" href="#tratamiento"><span class="mono k">Tratamiento</span><b>Cómo lo vamos a contar</b><small>${esc(TR.resumen || "")}</small><span class="go">→</span></a>` : ""}
      <a class="card lite" href="#presupuesto"><span class="mono k">Presupuesto</span><b class="num">${money(TOTAL)}</b><small>${esc(B.iva_nota)}</small><span class="go">→</span></a>
      <a class="card lite" href="#timing"><span class="mono k">Timing</span><b class="num">${fd(D0)} – ${fd(D1)}</b><small>Entrega del máster el ${fd(D1)}</small><span class="go">→</span></a>
    </div>`;

  S.tratamiento = () => secHead("tratamiento", `<span>${esc(TR.nota || "")}</span>`) + `
    <p class="t-intro">${esc(TR.intro)}</p>
    <div class="trat">${TR.bloques.map((b,i) => `<div class="tb${b.imagen ? "" : " noimg"}">${b.imagen ? `<img src="${b.imagen}" alt="${esc(b.titulo)}">` : ""}<div>${b.imagen ? `<div class="n mono">${String(i+1).padStart(2,"0")}</div>` : ""}<h3>${esc(b.titulo)}</h3><p>${esc(b.texto)}</p></div></div>`).join("")}</div>`;

  S.presupuesto = () => secHead("presupuesto", `<span>${esc(P.ref)} · ${esc(P.version)}</span><span>${fdy(P.fecha)} · Validez ${esc(B.validez)}</span>`, P.pdfs && P.pdfs.presupuesto) + `
    <div class="kv">
      <div><div class="k mono">Cliente</div><div class="v">${esc(P.cliente)}</div></div>
      <div><div class="k mono">Atención de</div><div class="v">${esc(P.contacto)}</div></div>
      <div><div class="k mono">Proyecto</div><div class="v">${esc(P.proyecto)}</div></div>
    </div>
    <div class="tblw"><table>
      <thead><tr><th>Concepto</th><th>Detalle</th><th class="r">Importe</th></tr></thead>
      <tbody>
        ${B.partidas.map(p => `<tr><td class="c">${esc(p.concepto)}</td><td class="d">${esc(p.detalle)}</td><td class="r num">${money(p.total)}</td></tr>`).join("")}
        <tr class="sub"><td></td><td class="lbl">Total trabajo</td><td class="r num">${money(trabajo)}</td></tr>
        <tr class="sep"><td colspan="3"></td></tr>
        ${(B.extras||[]).map(p => `<tr><td class="c">${esc(p.concepto)}</td><td class="d">${esc(p.detalle)}</td><td class="r num">${money(p.total)}</td></tr>`).join("")}
      </tbody>
    </table></div>
    <div class="total"><span class="k mono">Total</span><span class="v num">${money(TOTAL).replace(/ €$/,"")}<span>€</span></span></div>
    <p class="ivanote">${esc(B.iva_nota)}</p>
    <div class="notas"><h3 class="mono">Notas</h3>${B.notas.map(n => `<p>${esc(n)}</p>`).join("")}</div>`;

  /* ---- timing: gantt + calendario ---- */
  const color = t => `var(--c-${t})`;
  const monday = d => addD(d, -((d.getDay() + 6) % 7));
  const W0 = monday(pd(D0)), W1 = monday(pd(D1));
  const nW = Math.round((W1 - W0) / 6048e5) + 1;
  const bizIdx = d => { const w = Math.round((monday(d) - W0) / 6048e5); return w * 5 + Math.min((d.getDay() + 6) % 7, 4); };
  const nDays = nW * 5;

  const gantt = () => {
    const cols = `<div class="g-cols" style="grid-template-columns:repeat(${nW},1fr)">${[...Array(nW)].map(() => "<div></div>").join("")}</div>`;
    const head = `<div class="g-row g-head"><div class="g-l mono">Fase</div><div class="g-t"><div class="g-cols" style="grid-template-columns:repeat(${nW},1fr)">${[...Array(nW)].map((_,i) => `<div>Semana ${i+1} · ${fd(addD(W0, i*7))}</div>`).join("")}</div></div></div>`;
    const rows = T.fases.map(f => {
      const a = bizIdx(pd(f.ini)), b = bizIdx(pd(f.fin)) + 1;
      const one = f.ini === f.fin;
      const mark = one ? `<span class="g-dot" style="left:${(a + .5) / nDays * 100}%;background:${color(f.tipo)};color:${color(f.tipo)}"></span>`
                       : `<span class="g-bar" style="left:calc(${a / nDays * 100}% + 6px);right:calc(${100 - b / nDays * 100}% + 6px);background:${color(f.tipo)}"></span>`;
      return `<div class="g-row"><div class="g-l"><i style="background:${color(f.tipo)}"></i><div>${esc(f.t)}<small>${one ? fd(f.ini) : fd(f.ini) + " – " + fd(f.fin)}</small></div></div><div class="g-t">${cols}${mark}</div></div>`;
    }).join("");
    return `<div class="gw"><div class="gantt">${head}${rows}</div></div>`;
  };

  const calendario = () => {
    let html = `<div class="calw"><div class="cal"><div class="cal-dow">${DOW.map((d,i) => `<div class="${i > 4 ? "we" : ""}">${d}</div>`).join("")}</div>`;
    for (let w = 0; w < nW; w++){
      const days = [...Array(7)].map((_,i) => addD(W0, w*7 + i));
      const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const off = d => d.getDay() === 0 || d.getDay() === 6 || (T.no_laborables || []).includes(iso(d));
      const cells = days.map((d,i) => `<div class="${(d.getDate() === 1 || (w === 0 && i === 0) ? "m " : "") + (off(d) ? "off" : "")}">${d.getDate()}${d.getDate() === 1 || (w === 0 && i === 0) ? `<b>${MES[d.getMonth()]}</b>` : ""}</div>`).join("");
      const segs = [];
      T.fases.forEach(f => {
        const a = pd(f.ini), b = pd(f.fin);
        const s = a < days[0] ? days[0] : a, e = b > days[6] ? days[6] : b;
        if (s <= e) segs.push({c1:(s.getDay()+6)%7 + 1, c2:(e.getDay()+6)%7 + 2, f});
      });
      segs.sort((x,y) => x.c1 - y.c1 || y.c2 - x.c2);
      const lanes = [];
      const evs = segs.map(sg => {
        let l = lanes.findIndex(end => sg.c1 >= end);
        if (l < 0){ lanes.push(sg.c2); l = lanes.length - 1; } else lanes[l] = sg.c2;
        return `<div class="cal-ev ${sg.f.tipo}" style="grid-column:${sg.c1}/${sg.c2};grid-row:${l+1}" title="${esc(sg.f.t)}">${esc(sg.f.t)}</div>`;
      }).join("");
      const h = Math.max(112, 44 + lanes.length * 34);
      html += `<div class="cal-wk"><div class="cal-days">${cells.replace(/<div class="/g, `<div style="min-height:${h}px" class="`)}</div><div class="cal-evs">${evs}</div></div>`;
    }
    return html + `</div></div>`;
  };

  let vista = "cal";
  S.timing = () => secHead("timing", `<span>${fdy(D0)} – ${fdy(D1)}</span>`, P.pdfs && P.pdfs.timing) + `
    <div class="tbar">
      <div class="toggle" role="group" aria-label="Vista"><button type="button" data-v="cal" aria-pressed="true">Calendario</button><button type="button" data-v="gantt" aria-pressed="false">Gantt</button></div>
      <div class="legend">${[...new Set(T.fases.map(f => f.tipo))].map(t => `<span><i style="background:${color(t)}"></i>${TIPOS[t]}</span>`).join("")}</div>
    </div>
    <div id="tview">${calendario()}</div>`;

  document.getElementById("main").innerHTML = pages.map(p => `<section class="page" id="s-${p}" aria-label="${L[p]}">${S[p]()}</section>`).join("");
  document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
    vista = b.dataset.v;
    document.querySelectorAll(".toggle button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("tview").innerHTML = vista === "gantt" ? gantt() : calendario();
  }));

  function show(){
    const h = (location.hash || "").replace("#","");
    const cur = pages.includes(h) ? h : "inicio";
    pages.forEach(p => document.getElementById("s-" + p).classList.toggle("on", p === cur));
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.p === cur));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>

</body>
</html>
